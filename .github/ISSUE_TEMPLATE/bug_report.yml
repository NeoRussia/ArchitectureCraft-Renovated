name: Bug Report
description: Create a report to help reproduce and fix the issue
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        # Thank you for reporting!
        Two things make a report fixable: the **exact version**, and the **log**. Please fill in every field.
  - type: textarea
    id: bugdesc
    attributes:
      label: Description of the Bug
      description: >-
        Short description of what happens and what you expected instead. For a rendering issue, attach a
        screenshot of the problem and, if you can, of a working example beside it.
      placeholder: |
        {thing} renders as the missing model, but the block it was cut from renders correctly.
        I expected the shape to look like {thing}.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: >-
        Steps to reproduce, in detail. Say whether it also happens with only this mod installed, and for
        rendering issues whether a shader pack or resource pack was active.
      placeholder: |
        1. Place a {thing} block
        2. Cut it with the sawbench into {shape}
        3. Place the shape
        4. It shows the missing model
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: >-
        Mod version and jar file name, loader (Cleanroom or Forge) and its version, Java version, and your
        operating system. The SHA-256 of the jar helps too.
      placeholder: 3.108-0.5 (F672D4FA...), Cleanroom 0.7.14-alpha, Zulu 25, Windows 11
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: >-
        Paste the relevant lines from latest.log, or upload the whole file to mclo.gs and link it. If the
        game crashed, attach the crash report from crash-reports instead. Copy and paste, no backticks needed.
      render: shell
    validations:
      required: true
